<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1520" height="880" viewBox="0 0 1520 880" role="img" aria-labelledby="title desc"><title id="title">A startup check with an automatic fallback</title><desc id="desc">Enable Faster screen sharing in Settings, General, and restart Sysvia. The engine checks that it produces pictures and encodes each in under 25 milliseconds. The two possible outcomes are shown separately: use the new engine when the check passes, or continue with browser capture when it fails.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#203e35;font-weight:400}
.title{font-weight:550;letter-spacing:-1.8px}.muted{fill:#65736a}.label{font-size:22px;letter-spacing:2.4px;font-weight:600}.mono{font-family:'SF Mono',Consolas,monospace}.strong{font-weight:600}
.motion{transform-box:view-box}.window-slow{animation:drag 6s steps(12,end) infinite}.window-smooth{animation:drag 6s linear infinite}
@keyframes drag{0%,8%{transform:translateX(0)}48%,58%{transform:translateX(310px)}98%,100%{transform:translateX(0)}}
.scan{animation:scan 3s linear infinite}@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
.packet{animation:packet 7s linear infinite}@keyframes packet{0%,6%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}92%,100%{transform:translateX(1232px);opacity:0}}
.return{animation:return 4s linear infinite}@keyframes return{0%,8%{transform:translateX(0);opacity:0}12%,88%{opacity:1}92%,100%{transform:translateX(-1232px);opacity:0}}
.sample{opacity:.16;animation:sample 8s infinite;animation-delay:var(--delay,0s)}@keyframes sample{0%,12%{opacity:.16}26%,84%{opacity:1}96%,100%{opacity:.16}}
.result{animation:result 8s infinite}@keyframes result{0%,40%{opacity:.18}52%,87%{opacity:1}100%{opacity:.18}}
@media(prefers-reduced-motion:reduce){.motion,.sample,.result{animation:none!important;opacity:1!important}}
</style><rect x="0" y="0" width="1520" height="880" rx="0" fill="#f5f4ee" /><text x="64" y="64" font-size="22" class="label" >02  /  AUTOMATIC FALLBACK</text><text x="64" y="142" font-size="56" class="title">It checks before it switches.</text><text x="64" y="190" font-size="27" class="muted">The engine tries a capture at startup. Your screen keeps sharing either way.</text>
<circle cx="86" cy="273" r="22" fill="#e8ecdf"/><text x="86" y="281" font-size="21" text-anchor="middle" class="strong">1</text><text x="125" y="268" font-size="26" class="strong">Switch it on</text><text x="125" y="302" font-size="22" class="muted">Settings → General</text><path d="M483 271l8 7-8 7" fill="none" stroke="#65736a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="558" cy="273" r="22" fill="#e8ecdf"/><text x="558" y="281" font-size="21" text-anchor="middle" class="strong">2</text><text x="597" y="268" font-size="26" class="strong">Restart Sysvia</text><text x="597" y="302" font-size="22" class="muted">The setting takes effect</text><path d="M955 271l8 7-8 7" fill="none" stroke="#65736a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1030" cy="273" r="22" fill="#e8ecdf"/><text x="1030" y="281" font-size="21" text-anchor="middle" class="strong">3</text><text x="1069" y="268" font-size="26" class="strong">Check the capture</text><text x="1069" y="302" font-size="22" class="muted">Pictures + encoding time</text>
<rect x="64" y="356" width="664" height="408" rx="14" fill="#fffef9" stroke="#d7dcd1"/><text x="96" y="402" font-size="22" class="label" >IF THE CHECK PASSES</text>
<text x="96" y="444" font-size="24" class="muted">Pictures arrive. Encoding stays under 25 ms.</text>
<rect x="96" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:0s"/><rect x="138" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:0.18s"/><rect x="180" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:0.36s"/><rect x="222" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:0.54s"/><rect x="264" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:0.72s"/><rect x="306" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:0.8999999999999999s"/><rect x="348" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:1.08s"/><rect x="390" y="471" width="30" height="38" rx="3" fill="#37634e" class="sample" style="--delay:1.26s"/><path d="M96 541H696" fill="none" stroke="#d7dcd1" stroke-width="2" />
<g><rect x="96" y="571" width="48" height="48" rx="24" fill="#e8ecdf" class="result"/><path d="M109 594l7 7 13-15" fill="none" stroke="#37634e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="604" font-size="30" class="strong">Use the Sysvia engine</text>
<text x="96" y="659" font-size="25" class="muted">The faster stream starts automatically.</text></g>
<text x="96" y="718" font-size="21" class="muted">One startup check. Then it gets out of the way.</text><rect x="792" y="356" width="664" height="408" rx="14" fill="#fffef9" stroke="#d7dcd1"/><text x="824" y="402" font-size="22" class="label" >IF THE CHECK FAILS</text>
<text x="824" y="444" font-size="24" class="muted">No pictures, or encoding takes too long.</text>
<rect x="824" y="471" width="30" height="24" rx="3" fill="#b1926f" class="sample" style="--delay:0s"/><rect x="866" y="471" width="30" height="38" rx="3" fill="#b1926f" class="sample" style="--delay:0.18s"/><rect x="908" y="471" width="30" height="54" rx="3" fill="#b1926f" class="sample" style="--delay:0.36s"/><rect x="950" y="471" width="30" height="24" rx="3" fill="#b1926f" class="sample" style="--delay:0.54s"/><rect x="992" y="471" width="30" height="65" rx="3" fill="#b1926f" class="sample" style="--delay:0.72s"/><rect x="1034" y="471" width="30" height="40" rx="3" fill="#b1926f" class="sample" style="--delay:0.8999999999999999s"/><rect x="1076" y="471" width="30" height="27" rx="3" fill="#b1926f" class="sample" style="--delay:1.08s"/><rect x="1118" y="471" width="30" height="59" rx="3" fill="#b1926f" class="sample" style="--delay:1.26s"/><path d="M824 541H1424" fill="none" stroke="#d7dcd1" stroke-width="2" />
<g><rect x="824" y="571" width="48" height="48" rx="24" fill="#f2e8dc" class="result"/><path d="M840 588h16m-8-7-8 7 8 7" fill="none" stroke="#8a6137" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="888" y="604" font-size="30" class="strong">Use browser capture</text>
<text x="824" y="659" font-size="25" class="muted">Your screen keeps sharing automatically.</text></g>
<text x="824" y="718" font-size="21" class="muted">No settings to undo. No manual recovery.</text><path d="M64 798H1456" fill="none" stroke="#d7dcd1" stroke-width="2" /><text x="64" y="837" font-size="21" class="muted">Off by default. The offer to enable it appears only on NVIDIA PCs.</text><text x="1456" y="837" font-size="21" class="label" text-anchor="end">SYSVIA  /  2.3.3</text></svg>
