<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 710" width="1520" height="710" role="img" aria-labelledby="t d">
<title id="t">The usual capture next to Sysvia&#x2019;s own screen engine</title>
<desc id="d">A window moves across a screen in visible jumps with the usual capture, and smoothly with Sysvia&#x2019;s own screen engine, which sends many more pictures a second.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1119"/><stop offset="1" stop-color="#131c29"/></linearGradient>
