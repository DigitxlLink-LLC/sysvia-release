<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1520" height="832" viewBox="0 0 1520 832" role="img" aria-labelledby="title desc"><title id="title">How the new screen engine sends a picture</title><desc id="desc">The Windows PC captures the screen and encodes it on the graphics card. The picture crosses the network, then is decoded and displayed on the receiving computer. Input returns in the opposite direction. The visible pointer is local. Animation timing is illustrative, not a latency scale.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#203e35;font-weight:400}
.title{font-weight:550;letter-spacing:-1.8px}.muted{fill:#65736a}.label{font-size:22px;letter-spacing:2.4px;font-weight:600}.mono{font-family:'SF Mono',Consolas,monospace}.strong{font-weight:600}
.motion{transform-box:view-box}.window-slow{animation:drag 6s steps(12,end) infinite}.window-smooth{animation:drag 6s linear infinite}
@keyframes drag{0%,8%{transform:translateX(0)}48%,58%{transform:translateX(310px)}98%,100%{transform:translateX(0)}}
.scan{animation:scan 3s linear infinite}@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
.packet{animation:packet 7s linear infinite}@keyframes packet{0%,6%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}92%,100%{transform:translateX(1232px);opacity:0}}
.return{animation:return 4s linear infinite}@keyframes return{0%,8%{transform:translateX(0);opacity:0}12%,88%{opacity:1}92%,100%{transform:translateX(-1232px);opacity:0}}
.sample{opacity:.16;animation:sample 8s infinite;animation-delay:var(--delay,0s)}@keyframes sample{0%,12%{opacity:.16}26%,84%{opacity:1}96%,100%{opacity:.16}}
.result{animation:result 8s infinite}@keyframes result{0%,40%{opacity:.18}52%,87%{opacity:1}100%{opacity:.18}}
@media(prefers-reduced-motion:reduce){.motion,.sample,.result{animation:none!important;opacity:1!important}}
</style><rect x="0" y="0" width="1520" height="832" rx="0" fill="#f5f4ee" /><text x="64" y="64" font-size="22" class="label" >03  /  INSIDE THE SCREEN ENGINE</text><text x="64" y="142" font-size="56" class="title">From your PC to your screen.</text><text x="64" y="190" font-size="27" class="muted">Capture. Encode. Send. Decode. Display. A direct path for every picture.</text>
<text x="64" y="254" font-size="22" class="label" >WINDOWS PC</text><text x="632" y="254" font-size="22" class="label" >NETWORK</text><text x="1200" y="254" font-size="22" class="label" text-anchor="middle">YOUR COMPUTER</text>
<g transform="translate(69 290)" fill="none" stroke="#37634e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="2" width="58" height="38" rx="4"/><path d="M18 51h22m-11-11v11M8 12h10m-10 0v10m42 8H40m10 0V20"/></g><text x="64" y="390" font-size="31" class="strong">Capture</text><text x="64" y="483" font-size="22" >Straight from Windows</text><text x="64" y="517" font-size="20" class="muted">No browser capture</text><path d="M329 270H329V382" fill="none" stroke="#d7dcd1" stroke-width="2" /><g transform="translate(353 290)" fill="none" stroke="#37634e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="42" height="42" rx="5"/><rect x="19" y="15" width="20" height="20" rx="2"/><path d="M17-3v7m12-7v7m12-7v7M17 46v7m12-7v7m12-7v7M1 13h7m-7 12h7m-7 12h7m42-24h7m-7 12h7m-7 12h7"/></g><text x="348" y="390" font-size="31" class="strong">Encode</text><text x="348" y="483" font-size="22" >On the graphics card</text><text x="348" y="517" font-size="20" class="muted">~5 ms measured</text><path d="M613 270H613V382" fill="none" stroke="#d7dcd1" stroke-width="2" /><g transform="translate(637 290)" fill="none" stroke="#37634e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 17C17 2 41 2 57 17M10 28c11-10 27-10 38 0M20 39c5-5 13-5 18 0"/><circle cx="29" cy="50" r="2"/></g><text x="632" y="390" font-size="31" class="strong">Send</text><text x="632" y="483" font-size="22" >Across your network</text><text x="632" y="517" font-size="20" class="muted">Only spend bits on changes</text><path d="M897 270H897V382" fill="none" stroke="#d7dcd1" stroke-width="2" /><g transform="translate(921 290)" fill="none" stroke="#37634e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="50" height="44" rx="5"/><path d="m18 18-7 8 7 8m22-16 7 8-7 8M33 15l-8 22"/></g><text x="916" y="390" font-size="31" class="strong">Decode</text><text x="916" y="483" font-size="22" >On your other computer</text><text x="916" y="517" font-size="20" class="muted">Rebuild the picture</text><path d="M1181 270H1181V382" fill="none" stroke="#d7dcd1" stroke-width="2" /><g transform="translate(1205 290)" fill="none" stroke="#37634e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="2" width="58" height="38" rx="4"/><path d="M18 51h22m-11-11v11M8 30l12-10 11 6 16-14"/></g><text x="1200" y="390" font-size="31" class="strong">Display</text><text x="1200" y="483" font-size="22" >In the remote window</text><text x="1200" y="517" font-size="20" class="muted">Ready to see and use</text><path d="M92 433H1428" fill="none" stroke="#d7dcd1" stroke-width="2" /><path d="M1420 426l8 7-8 7" fill="none" stroke="#65736a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="96" cy="433" r="5" fill="#37634e"/><circle cx="380" cy="433" r="5" fill="#37634e"/><circle cx="664" cy="433" r="5" fill="#37634e"/><circle cx="948" cy="433" r="5" fill="#37634e"/><circle cx="1232" cy="433" r="5" fill="#37634e"/>
<g transform="translate(100 433)"><g class="motion packet"><rect x="-11" y="-9" width="22" height="18" rx="3" fill="#37634e" /><rect x="-5" y="-3" width="10" height="2" rx="1" fill="#daedab" /></g></g>
<rect x="64" y="570" width="1392" height="134" rx="12" fill="#e8ecdf" /><path d="M128 613H1392" fill="none" stroke="#d7dcd1" stroke-width="2" stroke-dasharray="4 8"/>
<path d="m136 606-8 7 8 7" fill="none" stroke="#65736a" stroke-width="2"/>
<g transform="translate(1376 613)"><g class="motion return"><circle r="7" fill="#37634e"/></g></g>
<text x="96" y="670" font-size="25" class="strong">Clicks and keystrokes travel back.</text><text x="1424" y="670" font-size="23" class="muted" text-anchor="end">Your pointer is drawn locally, so it never waits.</text>
<path d="M64 750H1456" fill="none" stroke="#d7dcd1" stroke-width="2" /><text x="64" y="789" font-size="21" class="muted">Illustrated sequence. Animation timing does not represent network latency.</text><text x="1456" y="789" font-size="21" class="label" text-anchor="end">SYSVIA  /  2.3.3</text></svg>
