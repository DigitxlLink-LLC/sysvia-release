<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="926" viewBox="0 0 1520 926" role="img" aria-labelledby="title desc"><title id="title">More of Sysvia, in your language.</title><desc id="desc">French, Portuguese and Korean translations are highlighted using real strings from the app. Language work includes dock menus, timed-wake options, Settings and remote-control messages. Translations were machine translated and corrected by hand; native-speaker feedback is welcome.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#203e35;font-weight:400}
.title{font-weight:550;letter-spacing:-1.8px}.muted{fill:#65736a}.label{letter-spacing:2px;font-weight:600}.strong{font-weight:600}
.motion{transform-box:view-box}.window{animation:drag 8s ease-in-out infinite}@keyframes drag{0%,12%,100%{transform:translateX(0)}45%,62%{transform:translateX(320px)}}
@media(prefers-reduced-motion:reduce){.motion{animation:none!important}.frame{opacity:0!important}.first{opacity:1!important}}
.lang-glow{animation:language 12s infinite;animation-delay:calc(var(--phase) - 12s)}@keyframes language{0%,29%{opacity:1}33%,96%,100%{opacity:0}}</style><rect x="0" y="0" width="1520" height="926" rx="0" fill="#f5f4ee" /><text x="64" y="64" font-size="21" class="label" >04 / LANGUAGE</text><text x="64" y="142" font-size="56" class="title">More of Sysvia, in your language.</text><text x="64" y="190" font-size="27" class="muted" >French, Portuguese and Korean now reach beyond the main window.</text>
    <rect x="64" y="252" width="444" height="276" rx="14" fill="#fffef9" stroke="#d7dcd1"/><g class="motion lang-glow" style="--phase:0s"><rect x="64" y="252" width="444" height="276" rx="14" fill="#e8ecdf" /></g><text x="92" y="297" font-size="21" class="label" >Français</text><text x="92" y="391" font-size="36" class="strong">Prêt à synchroniser</text><text x="92" y="489" font-size="21" class="muted" >“Ready to sync” in the app</text><rect x="538" y="252" width="444" height="276" rx="14" fill="#fffef9" stroke="#d7dcd1"/><g class="motion lang-glow" style="--phase:4s"><rect x="538" y="252" width="444" height="276" rx="14" fill="#e8ecdf" /></g><text x="566" y="297" font-size="21" class="label" >Português</text><text x="566" y="391" font-size="31" class="strong">Pronto para sincronizar</text><text x="566" y="489" font-size="21" class="muted" >“Ready to sync” in the app</text><rect x="1012" y="252" width="444" height="276" rx="14" fill="#fffef9" stroke="#d7dcd1"/><g class="motion lang-glow" style="--phase:8s"><rect x="1012" y="252" width="444" height="276" rx="14" fill="#e8ecdf" /></g><text x="1040" y="297" font-size="21" class="label" >한국어</text><text x="1040" y="391" font-size="35" class="strong">동기화 준비 완료</text><text x="1040" y="489" font-size="21" class="muted" >“Ready to sync” in the app</text>
