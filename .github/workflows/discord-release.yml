name: Announce release on Discord
on:
  release:
    types: [published]   # fires when a draft is published, not when it is created

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          PRE: ${{ github.event.release.prerelease }}
          BODY: ${{ github.event.release.body }}
        run: |
          [ "$PRE" = "true" ] && exit 0   # skip pre-releases
          jq -n --arg title "Sysvia $NAME is out" --arg url "$URL" --arg body "${BODY:0:1500}" \
            '{embeds:[{title:$title,url:$url,description:$body,color:5793266}]}' \
          | curl -sS -f -H 'Content-Type: application/json' -d @- "$WEBHOOK"
