name: Announce release on Discord
on:
  release:
    types: [published]   # fires when a draft is published, not when it is created
  workflow_dispatch:     # Actions, Announce release on Discord, Run workflow: posts a published release again
    inputs:
      tag:
        description: 'Tag of a published release to announce (for example v2.3.5)'
        required: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_JSON: ${{ github.event_name == 'release' && toJson(github.event.release) || '' }}
        run: |
          if [ -n "$TAG" ]; then RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"); fi
          export RELEASE_JSON
          [ "$(printf '%s' "$RELEASE_JSON" | jq -r '.prerelease')" = "true" ] && exit 0   # skip pre-releases
          node .github/scripts/discord-release.cjs | curl -sS -f -H 'Content-Type: application/json' -d @- "$WEBHOOK"
